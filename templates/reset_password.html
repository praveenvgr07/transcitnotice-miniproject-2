{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<div class="container">
  <div class="form-card" style="max-width:440px;">
    <div class="text-center mb-4">
      <div style="font-size:2.5rem;">🔐</div>
      <div class="form-title">Set New Password</div>
      <p class="text-muted small">Choose a strong new password for your account.</p>
    </div>
    <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}">
      <div class="mb-3">
        <label class="form-label" for="password">New Password</label>
        <input type="password" id="password" name="password" class="form-control"
               required minlength="8" placeholder="Min 8 characters">
      </div>
      <div class="mb-4">
        <label class="form-label" for="confirm_password">Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password"
               class="form-control" required placeholder="Repeat password">
      </div>
      <button type="submit" class="btn btn-primary-transit">
        <i class="bi bi-shield-lock me-2"></i>Reset Password
      </button>
    </form>
  </div>
</div>
{% endblock %}
