{% extends "base.html" %}
{% block title %}Forgot Password{% endblock %}
{% block content %}
<div class="container">
  <div class="form-card" style="max-width:440px;">
    <div class="text-center mb-4">
      <div style="font-size:2.5rem;">🔑</div>
      <div class="form-title">Forgot Password</div>
      <p class="text-muted small">Enter your registered email and we'll send a reset link.</p>
    </div>
    <form method="POST" action="{{ url_for('auth.forgot_password') }}">
      <div class="mb-4">
        <label class="form-label" for="email">Email Address</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-envelope"></i></span>
          <input type="email" id="email" name="email" class="form-control"
                 required autofocus placeholder="you@example.com">
        </div>
      </div>
      <button type="submit" class="btn btn-primary-transit">
        <i class="bi bi-send me-2"></i>Send Reset Link
      </button>
    </form>
    <p class="text-center mt-4 mb-0 small">
      Remember your password? <a href="{{ url_for('auth.login') }}" class="fw-600">Sign in</a>
    </p>
  </div>
</div>
{% endblock %}
