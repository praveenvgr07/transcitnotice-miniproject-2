{% extends "base.html" %}
{% block title %}500 – Server Error{% endblock %}
{% block content %}
<div class="container text-center py-5">
  <div style="font-size:5rem;opacity:.15;margin-bottom:1rem;">⚠️</div>
  <h1 class="fw-800" style="color:var(--danger);font-size:4rem;margin-bottom:.5rem;">500</h1>
  <h2 class="fw-600 text-muted mb-3">Internal Server Error</h2>
  <p class="text-muted" style="max-width:400px;margin:0 auto 2rem;">
    Something went wrong on our end. Our team has been notified. 
    Please try again in a moment.
  </p>
  <a href="{{ url_for('main.index') }}" class="btn btn-primary-transit" style="width:auto;">
    <i class="bi bi-house me-2"></i>Go Home
  </a>
</div>
{% endblock %}
